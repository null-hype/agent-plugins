id: organ-projects-from-data
language: typescript
severity: hint
message: Write the fact once. Everything else is a projection of it.
note: Test projects are generated from a data source, not written by hand.
rule:
  any:
    - kind: pair
      all:
        - has: { field: key, regex: "^projects$" }
        - has: { field: value, stopBy: end, kind: call_expression, regex: "\\.(map|flatMap)\\(" }
    - kind: variable_declarator
      all:
        - has: { field: name, regex: "^projects$" }
        - has: { field: value, kind: call_expression, regex: "\\.(map|flatMap)\\(" }

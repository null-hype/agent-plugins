id: organ-outcome-type
language: go
severity: hint
message: A broken instrument fails the run. A refuted hypothesis is a result.
note: A typed outcome that keeps "the check said no" apart from "the check broke".
rule:
  kind: const_declaration
  all:
    - has: { kind: const_spec, has: { field: type, regex: "." } }
    - has: { stopBy: end, kind: identifier, regex: "(Fail(ed|ure)?|Invalid|Denied|Refuted|Rejected)$" }
    - has: { stopBy: end, kind: identifier, regex: "(Error|EvalError|Broken|Missing|Crashed)$" }

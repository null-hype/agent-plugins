<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Duo left page</title>
    <style>
      html, body, #editor { margin: 0; width: 100%; height: 100%; }
      .duo-preview-removed { text-decoration: line-through; background: rgba(215, 58, 73, 0.22); }
      .duo-preview-added { background: rgba(40, 167, 69, 0.25); }
    </style>
    <!--claim-->
  </head>
  <body>
    <div id="editor"></div>
    <script>
      // The native side calls these three through evaluateJavaScript, possibly
      // before Monaco has loaded; state is kept and rendered once the editor exists.
      const claimElement = document.getElementById('claim');
      if (!claimElement) throw new Error('left page: no #claim element holds the claim text');
      const claimText = JSON.parse(claimElement.textContent);

      let editor = null;
      let cards = [];
      let previewed = null;
      let preview = null;

      function loadMonaco() {
        return new Promise((resolve, reject) => {
          const vs = new URL('monaco/vs', document.baseURI).href;
          const script = document.createElement('script');
          script.src = vs + '/loader.js';
          script.onload = () => {
            window.require.config({ paths: { vs } });
            window.require(['vs/editor/editor.main'], () => resolve(window.monaco), reject);
          };
          script.onerror = () => reject(new Error('Failed to load Monaco assets from ' + vs));
          document.head.appendChild(script);
        });
      }

      function findOption(cardId, optionId) {
        const card = cards.find((c) => c.id === cardId);
        const option = card && card.options.find((o) => o.id === optionId);
        if (!card || !option) throw new Error('left page: no option ' + optionId + ' on card ' + cardId);
        return { card, option };
      }

      function render() {
        const monaco = window.monaco;
        const model = editor.getModel();
        monaco.editor.setModelMarkers(model, 'duo-cards', cards.map((card) => ({
          startLineNumber: card.line,
          startColumn: 1,
          endLineNumber: card.line,
          endColumn: model.getLineMaxColumn(card.line),
          severity: card.counterexample ? monaco.MarkerSeverity.Error : monaco.MarkerSeverity.Info,
          message: card.counterexample
            ? 'Refuted: ' + card.title + ' - ' + card.counterexample
            : 'Open: ' + card.title,
          code: card.id,
        })));

        if (preview) preview.clear();
        preview = null;
        if (!previewed) return;
        const { card, option } = findOption(previewed.cardId, previewed.optionId);
        const column = model.getLineContent(card.line).indexOf(option.from) + 1;
        if (column === 0) throw new Error('left page: "' + option.from + '" is not on line ' + card.line);
        preview = editor.createDecorationsCollection([{
          range: new monaco.Range(card.line, column, card.line, column + option.from.length),
          options: {
            inlineClassName: 'duo-preview-removed',
            after: { content: option.to, inlineClassName: 'duo-preview-added' },
          },
        }]);
      }

      function update() {
        if (editor) render();
      }

      window.showCards = (next) => {
        cards = next;
        update();
      };
      window.previewOption = (cardId, optionId) => {
        if (cards.length) findOption(cardId, optionId);
        previewed = { cardId, optionId };
        update();
      };
      window.clearPreview = () => {
        previewed = null;
        update();
      };

      loadMonaco().then((monaco) => {
        editor = monaco.editor.create(document.getElementById('editor'), {
          automaticLayout: true,
          contextmenu: false,
          domReadOnly: true,
          fontSize: 15,
          lineNumbers: 'on',
          minimap: { enabled: false },
          readOnly: true,
          renderLineHighlight: 'none',
          scrollBeyondLastLine: false,
          theme: 'vs',
          value: claimText,
          wordWrap: 'on',
        });
        render();
      });
    </script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="720" viewBox="0 0 400 720" role="img" aria-label="image-claims/workspace-solved.svg"><rect width="100%" height="100%" fill="#ffffff"/><rect id="phone" x="10" y="10" width="380" height="700" rx="16" fill="none" stroke="#1e1e1e" stroke-width="2"/><text id="title" fill="#1e1e1e" font-family="Nunito, Helvetica, Arial, sans-serif" font-size="20" xml:space="preserve"><tspan x="30" y="48">Workspace</tspan></text><text id="state" fill="#757575" font-family="'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan x="300" y="48">solved</tspan></text><rect id="files" x="26" y="70" width="348" height="92" rx="0" fill="none" stroke="#1e1e1e" stroke-width="2"/><text id="files-label" fill="#757575" font-family="Nunito, Helvetica, Arial, sans-serif" font-size="14" xml:space="preserve"><tspan x="38" y="94">FILES</tspan></text><text id="files-list" fill="#1e1e1e" font-family="'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan x="38" y="120">rails-canary.png</tspan><tspan x="38" y="140">control.png</tspan></text><rect id="terminal" x="26" y="178" width="348" height="516" rx="0" fill="none" stroke="#1e1e1e" stroke-width="2"/><text id="terminal-label" fill="#757575" font-family="Nunito, Helvetica, Arial, sans-serif" font-size="14" xml:space="preserve"><tspan x="38" y="202">TERMINAL</tspan></text><text id="command" fill="#1e1e1e" font-family="'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan x="38" y="228">$ npm run image-claims -- \</tspan><tspan x="38" y="248">    rails-canary.png \</tspan><tspan x="38" y="268">    control.png</tspan></text><text id="summary" fill="#1e1e1e" font-family="'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan x="38" y="298">image-claims 0.2.0: 2 file(s),</tspan><tspan x="38" y="318">2 finding(s)</tspan></text><text id="finding-1" fill="#1e1e1e" font-family="'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan x="38" y="348">rails-canary.png:1</tspan><tspan x="38" y="368">  conflicting MATLAB headers:</tspan><tspan x="38" y="388">  libvips selects matload,</tspan><tspan x="38" y="408">  while matio selects the MAT</tspan><tspan x="38" y="428">  7.3/HDF5 reader; inspect</tspan><tspan x="38" y="448">  loader policy</tspan></text><text id="finding-2" fill="#1e1e1e" font-family="'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan x="38" y="478">rails-canary.png:1</tspan><tspan x="38" y="498">  declared .png but the bytes</tspan><tspan x="38" y="518">  are not a known image type</tspan></text><text id="verdict" fill="#1e1e1e" font-family="'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan x="38" y="548">No finding is not a safety</tspan><tspan x="38" y="568">verdict. These checks do not</tspan><tspan x="38" y="588">validate full image contents.</tspan></text><text id="exit" fill="#1e1e1e" font-family="'Cascadia Code', ui-monospace, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan x="38" y="618">$ echo $?</tspan><tspan x="38" y="638">1</tspan></text></svg>

[build]
command = "npm run build"
publish = "dist"
# Skip the build (and deploy preview) unless tutorial-app/ changed. Netlify
# runs this from the base directory, so "." is tutorial-app/.
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
  Cross-Origin-Embedder-Policy = "require-corp"
  Cross-Origin-Opener-Policy = "same-origin"

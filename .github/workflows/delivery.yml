name: delivery

# The plan's first test: Jules plans the goal without writing anything, and Jev
# judges that plan against the goal and against ours; retro checks the reasons
# Pass recorded. Our plan must be fixed before Jules's is seen, so this runs
# only on a pull request labelled `dispatch`.

on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - 'jev-playwright/delivery/**'
      - '.github/workflows/delivery.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  loop:
    if: contains(github.event.pull_request.labels.*.name, 'dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jev-playwright
    env:
      JULES_KEY_REF: pass://infra/jules.google.com/JULES_API_KEY
      TYPESAFE_KEY_REF: pass://infra/typesafe.ai/TYPESAFE_API_KEY
      PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
      PROTON_PASS_KEY_PROVIDER: fs
      PROTON_PASS_SESSION_DIR: /tmp/pass-agent-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jev-playwright/package-lock.json
      - run: npm ci
      - name: Log in to Proton Pass
        run: |
          curl -fsSL https://proton.me/download/pass-cli/install.sh | bash
          pass-cli login
      - name: Run the loop
        run: npx playwright test -c delivery
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: jev-playwright/delivery/test-results/
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: pass-cli logout >/dev/null 2>&1 || true

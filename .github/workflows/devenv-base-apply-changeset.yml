name: devenv-base-apply-changeset

# Merging is applying (CIT-472). A merge to main that changes the committed
# changeset makes Render deploy a new version of the supervisor Workflow;
# this waits for that version and runs its `apply` task against Linear.
on:
  push:
    branches: [main]
    paths:
      - .dagger/internal/devenv-base/workflow/changeset.json

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        with:
          verb: call
          workdir: .dagger/internal/devenv-base
          args: apply-supervisor-changeset --proton-pass-token=env:PROTON_PASS_PERSONAL_ACCESS_TOKEN --commit=${{ github.sha }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

name: devenv-base-sync-workflow-secrets

# Copies the Linear key from Proton Pass into the supervisor's Render Workflow
# service (CIT-472). Runs on demand, or from a pushed head commit that says
# [sync-workflow-secrets].
on:
  workflow_dispatch:
  push:

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sync-workflow-secrets]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        with:
          verb: call
          workdir: .dagger/internal/devenv-base
          args: sync-supervisor-workflow-secrets --proton-pass-token=env:PROTON_PASS_PERSONAL_ACCESS_TOKEN
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

name: "Experiment - live Jev (manual)"
# A separate executable path. Default tests never call this script.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Jev model (blank = default)"
        type: string
        default: ""
      repeats:
        description: "Repeat count"
        type: string
        default: "1"
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    environment: paid-experiments
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: python3 -m pip install "pkl-python==0.1.19"
      - name: "Live Jev over the toy's recorded evidence"
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_MODEL: ${{ inputs.model }}
          REPEATS: ${{ inputs.repeats }}
          EVIDENCE_LIB: ${{ github.workspace }}/src/evidence/lib
          EVIDENCE_PKL: ${{ github.workspace }}/src/evidence/pkl
          JEV_PKL: ${{ github.workspace }}/src/jev/pkl
          CONTRACT_RECORDS_DIR: ${{ github.workspace }}/build/contract-records
        run: |
          export PATH="$PWD/src/jev:$PATH"
          python3 test/_global/cit-286-toy-smoke/cit-286-toy-smoke_live.py \
            --evidence docs/method/toy-case/expected-evidence.json --repeats "$REPEATS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-records-live
          path: build/contract-records/
          if-no-files-found: warn

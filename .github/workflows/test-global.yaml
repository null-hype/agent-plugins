name: "CI - Test Global Scenarios"

# Manual-only: the 'jin-81-pass-cli' global scenario fetches a
# live Claude Code OAuth token from Proton Pass and uses it to call the
# Anthropic API. It intentionally does NOT run on push/pull_request so that
# token never materializes during routine CI, only when explicitly triggered.
on:
  workflow_dispatch:

jobs:
  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        run: devcontainer features test --global-scenarios-only .

  # JIN-92: the deterministic, restic-mechanics half of what used to be
  # part of the jin-91-resume-session global scenario now lives here, as
  # a feature-local 'pass-cli' scenario (test/pass-cli/restic-backup.sh).
  # It needs the same live Proton Pass token and restic/GCP secrets as
  # the global scenarios above, so it's manual-only for the same reason
  # (see the top-of-file comment): that token should never materialize
  # on routine push/pull_request CI.
  test-pass-cli-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing 'pass-cli' feature scenarios"
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        run: devcontainer features test -f pass-cli --skip-autogenerated --skip-duplicated .

name: "CI - Test Global Scenarios"

# Manual-only: scenario-based tests always materialize live credentials
# (a Proton Pass token, restic/GCP secrets) somewhere in the container,
# whether the scenario lives under a feature's own scenarios.json or in
# test/_global. So instead of splitting that risk across per-feature
# workflows, one job here covers every scenario-based test (feature-local
# and global alike) via '--skip-autogenerated', and none of it runs on
# push/pull_request - only on explicit workflow_dispatch.
on:
  workflow_dispatch:

# CIT-147: the exporter step below reads this run's own job/step conclusions
# via the GitHub Actions Jobs API (see tk-evidence-exporter/internal/
# ghactions) instead of scraping this job's stdout -- that needs read access
# to the Actions API for GITHUB_TOKEN, which the default token grants unless
# the repo/org default has been narrowed, hence spelling it out explicitly.
permissions:
  contents: read
  actions: read

jobs:
  test-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing all scenarios (feature-local and global)"
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        run: devcontainer features test --skip-autogenerated --skip-duplicated .

      # CIT-147: export the restic-backup scenario's evidence (its restic
      # snapshot manifest + this job's own structured GitHub Actions outcome)
      # into a Pkl-validated package. This is the first input the
      # tk-evidence-exporter pipeline runs against in CI; see
      # tk-evidence-exporter/README.md for the full contract. `if: always()`
      # because the exporter's own diagnostics (see internal/export.Diagnose)
      # are useful even when the scenario run itself failed.
      - name: "Set up Go for tk-evidence-exporter"
        if: always()
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # CIT-147: tk-evidence-exporter's cmd/export shells out to a native
      # `pkl` binary via pkl-go (pkl.NewEvaluator) to validate the assembled
      # package against pkl/Evidence.pkl -- it does not vendor or bundle
      # Pkl itself. The repo's own root mise.toml already declares `pkl =
      # "latest"` (not a pinned version); installing via jdx/mise-action
      # here (rather than a separately-pinned curl/download step) keeps
      # this runner on that same single source of truth as every
      # devcontainer/sandbox in this repo, instead of a second, separately
      # drifting version pin.
      - name: "Install mise-managed tools (pkl) for tk-evidence-exporter"
        if: always()
        uses: jdx/mise-action@v2

      - name: "Verify pkl is on PATH"
        if: always()
        run: pkl --version

      - name: "Export restic-backup scenario evidence (CIT-147)"
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # restic-backup.sh writes into a directory that `devcontainer
          # features test` bind-mounts from this runner into the scenario's
          # container (confirmed by inspecting the CLI's own `docker run
          # --mount` invocation) -- so by the time this step runs, its
          # output is sitting somewhere under the CLI's own scratch base on
          # this same runner. Only the restic-backup scenario writes any of
          # these filenames, so a search rooted there finds exactly one
          # match each.
          #
          # CIT-147: discover by scenario-outcome.json, not
          # restic-snapshots.json. restic-backup.sh's `on_exit` trap writes
          # scenario-outcome.json on *every* exit path -- including a
          # skipped run (missing PROTON_PASS_PERSONAL_ACCESS_TOKEN) or a
          # failure before ever reaching the restic backup step -- so it's
          # the one file guaranteed to exist whenever the scenario script
          # ran at all. Discovering by restic-snapshots.json instead would
          # silently drop exactly those two verdicts: the scenario recorded
          # a real "skipped"/"failed" outcome, but this step would never
          # even invoke cmd/export to export it.
          EVIDENCE_OUTCOME_SRC="$(find /tmp/devcontainercli/container-features-test -path '*/evidence/scenario-outcome.json' 2>/dev/null | head -1)"
          if [ -z "$EVIDENCE_OUTCOME_SRC" ]; then
            echo "::warning::tk-evidence-exporter: no scenario-outcome.json found -- the restic-backup scenario's own script never ran (e.g. the devcontainer build itself failed before any test script executed). Nothing to export this run."
            exit 0
          fi
          EVIDENCE_DIR="$(dirname "$EVIDENCE_OUTCOME_SRC")"

          # -snapshots-json is optional: a skipped scenario, or one that
          # failed before capturing a snapshot, legitimately has none.
          SNAPSHOTS_ARGS=()
          if [ -f "$EVIDENCE_DIR/restic-snapshots.json" ]; then
            SNAPSHOTS_ARGS=(-snapshots-json "$EVIDENCE_DIR/restic-snapshots.json")
          else
            echo "::warning::tk-evidence-exporter: no restic-snapshots.json found -- the scenario ended (skipped or failed) before capturing any restic snapshot. Exporting the scenario outcome only."
          fi

          LS_ARGS=()
          if [ -f "$EVIDENCE_DIR/restic-ls.json" ]; then
            LS_ARGS=(-ls-json "$EVIDENCE_DIR/restic-ls.json")
          fi

          cd tk-evidence-exporter
          go run ./cmd/export \
            -scenario restic-backup \
            "${SNAPSHOTS_ARGS[@]}" \
            "${LS_ARGS[@]}" \
            -scenario-outcome-json "$EVIDENCE_DIR/scenario-outcome.json" \
            -out "$GITHUB_WORKSPACE/build/tk-evidence"

      - name: "Upload evidence package"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk-evidence-restic-backup
          path: build/tk-evidence/
          if-no-files-found: ignore

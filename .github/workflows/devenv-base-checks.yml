name: devenv-base-checks

on:
  push:
    branches: [main]
    paths:
      - '.dagger/internal/devenv-base/**'
  pull_request:
    paths:
      - '.dagger/internal/devenv-base/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dagger-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: check
          workdir: .dagger/internal/devenv-base
          # Enables cross-run distributed build caching + traces via Dagger Cloud.
          # Source of truth: pass://development/devenv-base/DAGGER_CLOUD_TOKEN
          # (mirrored into this repo's Actions secrets; rotate there first).
          # Must be passed as the action's own `cloud-token` input, not a step
          # `env:` var — the action's composite script builds its own
          # `DAGGER_CLOUD_TOKEN=${{ inputs.cloud-token }}` invocation, which
          # overwrites (with empty) whatever step-level env is set.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - pass-cli
          - playwright-cli
          - evidence
          - jev
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - pass-cli
          - playwright-cli
          - evidence
          - jev
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  # Host-only Pkl and binding checks. Installation is verified separately by
  # the real devcontainer jobs, including test-global-deterministic.
  pkl-contracts-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: "Pkl contracts and case reconciliation (host)"
        run: pkl test --module-path src/evidence/pkl:src/jev/pkl test/_global/cit-286-contract/cit-286-contract.test.pkl test/_global/cit-286-toy-smoke/cit-286-toy-smoke.test.pkl
      - name: "Install pkl-python (the jev bin builds requests through Jev.pkl)"
        run: python3 -m pip install "pkl-python==0.1.19"
      - name: "Deterministic contract driver (host, no container, zero real calls)"
        env:
          EVIDENCE_LIB: ${{ github.workspace }}/src/evidence/lib
          EVIDENCE_PKL: ${{ github.workspace }}/src/evidence/pkl
          CONTRACT_RECORDS_DIR: ${{ github.workspace }}/build/contract-records
        run: |
          export PATH="$PWD/src/evidence:$PWD/src/jev:$PATH"
          python3 test/_global/cit-286-contract/cit-286-contract_test.py
          python3 test/_global/cit-286-toy-smoke/cit-286-toy-smoke_test.py
          python3 test/jev/contract_test.py src/jev/jev
      - name: "Upload evaluation records (host run)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-records-host
          path: build/contract-records/
          if-no-files-found: warn

  # Real container test of the deterministic scenarios. The scenarios are
  # selected explicitly (everything else in test/_global is pruned) and the
  # entry points invoke only mock Jev. Live execution has its own entry point.
  test-global-deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Select the deterministic scenarios explicitly"
        run: |
          jq 'with_entries(select(.key == "cit-286-contract" or .key == "cit-286-toy-smoke"))' \
            test/_global/scenarios.json > /tmp/scenarios.json
          mv /tmp/scenarios.json test/_global/scenarios.json
          jq -r 'keys[]' test/_global/scenarios.json
      - name: "devcontainer features test (global scenarios, deterministic)"
        run: devcontainer features test --global-scenarios-only .

      - name: "Collect evaluation records"
        if: always()
        run: |
          mkdir -p build/contract-records
          find /tmp/devcontainercli/container-features-test -type d -name contract-records 2>/dev/null \
            -exec cp -r {}/. build/contract-records/ \; || true
      - name: "Upload evaluation records"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-records-container
          path: build/contract-records/
          if-no-files-found: warn

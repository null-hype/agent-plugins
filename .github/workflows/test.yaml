name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to a PR supersedes the run in flight.
concurrency:
  # Only PR runs share a group; every other run gets its own (run_id), so
  # pushes to main are never cancelled or replaced while queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Both jobs below are continue-on-error, so they inform rather than gate.
  # Test only the features whose src/ or test/ changed (all of them on
  # workflow_dispatch or when this workflow changes), and skip draft PRs
  # until they are marked ready.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.set.outputs.features }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared:
              - '.github/workflows/test.yaml'
            pass-cli: ['src/pass-cli/**', 'test/pass-cli/**']
            playwright-cli: ['src/playwright-cli/**', 'test/playwright-cli/**']
            # A feature's scenarios also install the features they compose
            # (test/<feature>/scenarios.json), so those changes select it too.
            noteexpand: ['src/noteexpand/**', 'test/noteexpand/**', 'src/jev/**']
            jev: ['src/jev/**', 'test/jev/**', 'src/pass-cli/**']
            cve-2026-66066: ['src/cve-2026-66066/**', 'test/cve-2026-66066/**']
      - id: set
        run: |
          all='["pass-cli","playwright-cli","noteexpand","jev","cve-2026-66066"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            features=$all
          else
            features=$(jq -c 'map(select(. != "shared"))' <<<'${{ steps.filter.outputs.changes }}')
          fi
          echo "features=$features" >> "$GITHUB_OUTPUT"

  test-autogenerated:
    needs: changes
    if: needs.changes.outputs.features != '[]' && needs.changes.outputs.features != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features: ${{ fromJSON(needs.changes.outputs.features) }}
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    needs: changes
    if: needs.changes.outputs.features != '[]' && needs.changes.outputs.features != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features: ${{ fromJSON(needs.changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

      - name: "Upload noteexpand scenario records"
        if: always() && matrix.features == 'noteexpand'
        uses: actions/upload-artifact@v4
        with:
          name: noteexpand-scenarios
          path: /tmp/devcontainercli/container-features-test/**/noteexpand-records/**
          if-no-files-found: warn

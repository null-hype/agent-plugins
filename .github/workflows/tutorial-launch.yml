name: Tutorial launch checks

on:
  pull_request:
    paths: ['tutorial-app/**', 'docs/launch/**', 'profile/**', 'README.md', 'SECURITY.md', '.github/ISSUE_TEMPLATE/**', '.github/workflows/tutorial-launch.yml']
  push:
    branches: [main]
    paths: ['tutorial-app/**', 'docs/launch/**', 'profile/**', 'README.md', 'SECURITY.md', '.github/ISSUE_TEMPLATE/**', '.github/workflows/tutorial-launch.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only PR runs share a group; every other run gets its own (run_id), so
  # pushes to main are never cancelled or replaced while queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  branch-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorial-app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-replay-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutorial-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run image-claims:check
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: .dagger/internal/devenv-base/toolbox/go.mod
          cache-dependency-path: .dagger/internal/devenv-base/toolbox/go.sum
      - name: Render static report fixtures for local browser checks
        working-directory: .dagger/internal/devenv-base/toolbox
        run: |
          go build -o "$RUNNER_TEMP/toolbox-report" .
          "$RUNNER_TEMP/toolbox-report" render-claim < testdata/completed-claim.json > ../../../../tutorial-app/dist/claim-fixture.html
          "$RUNNER_TEMP/toolbox-report" render-claim < testdata/completed-claim-preregistration.json > ../../../../tutorial-app/dist/preregistration-claim-fixture.html
          python3 - <<'PY' > "$RUNNER_TEMP/red-claim.json"
          import json
          with open('testdata/completed-claim.json') as source:
              claim = json.load(source)
          claim['exit'] = 1
          claim['issue']['state'] = {'id': 'fixture-review', 'name': 'In Review', 'type': 'started'}
          claim['snapshot']['id'] = ''
          claim['snapshot']['url'] = ''
          print(json.dumps(claim))
          PY
          "$RUNNER_TEMP/toolbox-report" render-claim < "$RUNNER_TEMP/red-claim.json" > ../../../../tutorial-app/dist/red-claim-fixture.html
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.launch.config.ts
        env:
          LAUNCH_BASE_URL: http://127.0.0.1:4321
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-launch-branch
          path: |
            playwright-report/launch
            test-results/launch
          retention-days: 7

  public-smoke:
    # Dispatch after publication to verify the real public journey. A green
    # branch build alone must never be reported as deployed verification.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorial-app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-replay-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutorial-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.launch.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-launch-public
          path: |
            playwright-report/launch
            test-results/launch
          retention-days: 7

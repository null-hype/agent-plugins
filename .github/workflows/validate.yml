name: "Validate devcontainer-feature.json files"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'test/_global/**'
      - '.devcontainer/**'
      - 'scripts/render-agent-template.py'
      - '.github/workflows/validate.yml'

concurrency:
  # Only PR runs share a group; every other run gets its own (run_id), so
  # pushes to main are never cancelled or replaced while queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  # A rendered agent template (.devcontainer/<scenario>/) must still match
  # its global scenario and the features it copies from src/.
  agent-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Check rendered agent templates are current"
        run: |
          rendered=$(jq -r 'keys[]' test/_global/scenarios.json | while read -r s; do if [ -d ".devcontainer/$s" ]; then echo "$s"; fi; done)
          [ -z "$rendered" ] || python3 scripts/render-agent-template.py --check $rendered

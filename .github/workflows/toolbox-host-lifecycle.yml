# Keeps toolbox-host's lifecycle settings in step with the repository, so the
# VM never runs 24/7 (CIT-466, CIT-434):
#
#   - the startup-script and toolbox-lifecycle metadata keys, from
#     host-startup.sh and host-lifecycle.sh: the host's own idle stop and
#     lease, which take effect at its next boot;
#   - a GCE max run duration with a STOP action: Compute Engine stops the VM
#     after MAX_RUN, whatever happens on the host. It is the backstop for a
#     host whose lifecycle timer died; the host's own hard cap (240 min) plus
#     its stop budget comes first. GCE only changes it while the VM is
#     stopped, so a running host gets it on a later run.
#
# A push to any other branch only plans: it shows what main would change.
# The daily run picks up the backstop once the host has been stopped.
#
# Proton Pass is secret zero: the job holds only its token and reads the GCP
# key from Pass, as setup-host.sh does.
name: toolbox-host lifecycle

on:
  push:
    paths:
      - .dagger/internal/devenv-base/toolbox/host-startup.sh
      - .dagger/internal/devenv-base/toolbox/host-lifecycle.sh
      - .github/workflows/toolbox-host-lifecycle.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: toolbox-host-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ZONE: us-central1-a
      NAME: toolbox-host
      MAX_RUN: 4h30m
      MAX_RUN_SECONDS: "16200"
      APPLY: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Proton Pass
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        run: |
          curl -fsSL https://proton.me/download/pass-cli/install.sh | bash
          echo "PROTON_PASS_SESSION_DIR=/tmp/pass-session" >> "$GITHUB_ENV"
          echo "PROTON_PASS_KEY_PROVIDER=fs" >> "$GITHUB_ENV"
          PROTON_PASS_SESSION_DIR=/tmp/pass-session PROTON_PASS_KEY_PROVIDER=fs pass-cli login

      - name: Plan or apply
        env:
          PROTON_PASS_AGENT_REASON: "toolbox-host lifecycle: keep the VM's idle stop and max run duration in step"
        run: |
          pass-cli run --env-file .dagger/internal/devenv-base/.devcontainer/gcloud.env -- bash -euo pipefail -c '
            tmp=$(mktemp -d)
            chmod 700 "$tmp"
            trap "rm -rf $tmp" EXIT
            export CLOUDSDK_CONFIG=$tmp/gcloud
            printf %s "$GCP_SERVICE_ACCOUNT_KEY" > "$tmp/key.json"
            gcloud auth activate-service-account --key-file="$tmp/key.json" --quiet
            gcloud config set project "$GOOGLE_PROJECT_ID" --quiet

            dir=.dagger/internal/devenv-base/toolbox
            gcloud compute instances describe "$NAME" --zone "$ZONE" --format=json > "$tmp/vm.json"
            status=$(jq -r .status "$tmp/vm.json")
            run=$(jq -r ".scheduling.maxRunDuration.seconds // empty" "$tmp/vm.json")
            action=$(jq -r ".scheduling.instanceTerminationAction // empty" "$tmp/vm.json")
            meta() { jq -r --arg k "$1" "[.metadata.items[]? | select(.key == \$k) | .value][0] // empty" "$tmp/vm.json"; }
            echo "== $NAME is $status; max run duration ${run:-none} s, termination action ${action:-none}"
            echo "== metadata keys: $(jq -r "[.metadata.items[]?.key] | join(\", \")" "$tmp/vm.json")"

            stale=()
            [ "$(meta startup-script)" = "$(cat "$dir/host-startup.sh")" ] || stale+=(startup-script)
            [ "$(meta toolbox-lifecycle)" = "$(cat "$dir/host-lifecycle.sh")" ] || stale+=(toolbox-lifecycle)
            echo "== metadata out of date: ${stale[*]:-none}"
            backstop=false
            [ "$run" = "$MAX_RUN_SECONDS" ] && [ "$action" = STOP ] || backstop=true
            echo "== max run duration needs setting: $backstop"

            if [ "$APPLY" != true ]; then
              echo "== plan only: main applies this"
              exit 0
            fi
            if [ ${#stale[@]} -gt 0 ]; then
              gcloud compute instances add-metadata "$NAME" --zone "$ZONE" \
                --metadata-from-file "startup-script=$dir/host-startup.sh,toolbox-lifecycle=$dir/host-lifecycle.sh"
              echo "== metadata updated; the host picks it up at its next boot"
            fi
            if [ "$backstop" = true ]; then
              if [ "$status" = TERMINATED ]; then
                gcloud compute instances set-scheduling "$NAME" --zone "$ZONE" \
                  --max-run-duration="$MAX_RUN" --instance-termination-action=STOP
                echo "== max run duration set to $MAX_RUN with a STOP action"
              else
                echo "::warning::$NAME is $status; GCE changes max run duration only on a stopped VM, so a later run sets it"
              fi
            fi
          '

      - name: Log out of Proton Pass
        if: always()
        run: pass-cli logout || true

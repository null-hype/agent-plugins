name: "Refresh pass-cli skill content"

# Manual-only, and separate from CI: this regenerates the *content* of
# src/color/.claude/skills/pass-cli/SKILL.md from a live, authenticated
# `pass-cli agent instructions` call (e.g. after a pass-cli version
# bump) and opens a PR with the change. Tests (test-global.yaml) just
# verify the checked-in skill is installed and picked up - they don't
# refresh its content themselves.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: "Regenerate skill content"
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        run: |
          if ! command -v pass-cli >/dev/null 2>&1; then
            curl -fsSL https://proton.me/download/pass-cli/install.sh | bash
          fi
          export PROTON_PASS_SESSION_DIR="/tmp/pass-agent-ci"
          # See test/_global/jin-81/Dockerfile for why this is needed.
          export PROTON_PASS_KEY_PROVIDER="fs"
          pass-cli login
          # -B: the checked-in file already exists, so make would otherwise
          # consider it up to date and skip regenerating it.
          make -B src/color/.claude/skills/pass-cli/SKILL.md
          pass-cli logout || true

      - name: "Open PR if content changed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.email github-actions[bot]@users.noreply.github.com
          git config --global user.name github-actions[bot]
          git add src/color/.claude/skills/pass-cli/SKILL.md
          git diff --cached --quiet && echo "No changes." && exit 0
          branch="refresh-pass-cli-skill-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git commit -m "Refresh pass-cli skill content"
          git push origin "$branch"
          gh pr create --title "Refresh pass-cli skill content" \
            --body "Automated refresh of src/color/.claude/skills/pass-cli/SKILL.md from a live \`pass-cli agent instructions\` call."

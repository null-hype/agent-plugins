name: recreate-devpod

on:
  workflow_dispatch:

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs `.devcontainer/devpod-gce.sh --recreate` inside the Devpod
      # image via the RecreateDevpod dagger function -- see main.go for why
      # this goes through Dagger instead of installing devpod/gcloud/restic/
      # pass-cli on the runner directly.
      - uses: dagger/dagger-for-github@v8.4.1
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        with:
          verb: call
          args: recreate-devpod --proton-pass-token=env:PROTON_PASS_PERSONAL_ACCESS_TOKEN

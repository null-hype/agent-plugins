name: Publish Storybook to GitHub Pages

# Published at https://null-hype.github.io/agent-plugins/
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['tutorial-app/**', '.github/workflows/storybook-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutorial-app/package-lock.json
      - run: npm ci && npm run build-storybook
        working-directory: tutorial-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tutorial-app/storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4

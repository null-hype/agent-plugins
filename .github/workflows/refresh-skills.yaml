name: "Refresh skill content"

# Manual-only, and separate from CI: this regenerates the *content* of
# every skill's SKILL.md (via `make skills` - see the Makefile) and
# opens a PR with whatever changed. Tests (test-global.yaml) just
# verify the checked-in skills are installed and picked up - they
# don't refresh their content themselves.
#
# Credential setup here is currently pass-cli-specific, since that's
# the only skill that exists today. A future skill needing different
# credentials to regenerate will need its own login step added
# alongside this one; only the Makefile's `skills` target needs to
# know about every skill's own build rule.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: "Regenerate skill content"
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        run: |
          if ! command -v pass-cli >/dev/null 2>&1; then
            curl -fsSL https://proton.me/download/pass-cli/install.sh | bash
          fi
          export PROTON_PASS_SESSION_DIR="/tmp/pass-agent-ci"
          # See test/_global/jin-81-pass-cli/Dockerfile for why this is needed.
          export PROTON_PASS_KEY_PROVIDER="fs"
          pass-cli login
          # -B: checked-in skill files already exist, so make would
          # otherwise consider them up to date and skip regenerating them.
          make -B skills
          pass-cli logout || true

      - name: "Open PR if content changed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          shopt -s globstar
          git config --global user.email github-actions[bot]@users.noreply.github.com
          git config --global user.name github-actions[bot]
          git add -A -- **/.claude/skills/**/SKILL.md
          git diff --cached --quiet && echo "No changes." && exit 0
          branch="refresh-skills-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git commit -m "Refresh skill content"
          git push origin "$branch"
          gh pr create --title "Refresh skill content" \
            --body "Automated refresh of skill content via \`make skills\`."

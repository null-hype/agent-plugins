name: devenv-base-supervisor-run

# The supervisor (CIT-472) is the Claude session in the Render cron
# `supervisor`, at :13: it writes a changeset, checks it on the workflow's
# dev server, and merges its PR once the checks are green, which fires
# devenv-base-apply-changeset on main. Nothing here calls a model.
#
# This hourly job is the safety net under that: a merged changeset whose
# apply failed (a Proton login timeout, say) is applied again, so a plan is
# never left merged but unapplied.
#
# Never disable, suspend or delete this job, the cron or the Render Workflow
# without Richard's explicit OK (Richard, 2026-10-22).
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  apply-again:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply the last changeset again if its apply failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r id conclusion < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow devenv-base-apply-changeset.yml \
            --branch main --event push --limit 1 --json databaseId,conclusion --jq '.[0] | "\(.databaseId) \(.conclusion)"')
          if [ "$conclusion" = failure ]; then
            gh run rerun "$id" --repo "$GITHUB_REPOSITORY" --failed
            echo "### Applying the last changeset again (run $id)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The last apply ($id) is $conclusion; nothing to do."
          fi

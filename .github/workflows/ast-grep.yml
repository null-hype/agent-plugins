name: "ast-grep rules"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same command as the ast-grep step in hk.pkl.
      - run: npx --yes --package=@ast-grep/cli@0.50.0 ast-grep test && npx --yes --package=@ast-grep/cli@0.50.0 ast-grep scan --no-ignore hidden --filter '^lint-'

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Drift debugging method</title>
  <desc id="d">The main thread is forked by hand. The fork steers one level down, work travels further down and back up, and the result is compared with the original. If it drifted, steer again. A useful exchange is compiled into a notebook and replayed with its exact prompts and context, then compared again.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4852"/></marker>
    <style>
      .b{fill:#f4f6f8;stroke:#3d4852;stroke-width:1.5}
      .k{fill:#e3eefb;stroke:#1f5fa8;stroke-width:1.5}
      .h{font-size:15px;font-weight:600;fill:#1b2228;text-anchor:middle}
      .s{font-size:12px;fill:#4a5560;text-anchor:middle}
      .l{font-size:12px;fill:#4a5560}
      .e{fill:none;stroke:#3d4852;stroke-width:1.5;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>

  <rect class="b" x="24" y="34" width="170" height="70" rx="8"/>
  <text class="h" x="109" y="65">Main thread</text>
  <text class="s" x="109" y="85">the original</text>

  <rect class="b" x="246" y="34" width="170" height="70" rx="8"/>
  <text class="h" x="331" y="65">My fork</text>
  <text class="s" x="331" y="85">made by hand in Delta</text>

  <rect class="b" x="468" y="34" width="170" height="70" rx="8"/>
  <text class="h" x="553" y="65">One level down</text>
  <text class="s" x="553" y="85">the only agent I steer</text>

  <rect class="b" x="686" y="34" width="170" height="70" rx="8"/>
  <text class="h" x="771" y="65">Further down</text>
  <text class="s" x="771" y="85">reached by handoffs</text>

  <path class="e" d="M194 69H244"/>
  <text class="l" x="204" y="58">fork</text>
  <path class="e" d="M416 60H466"/>
  <text class="l" x="424" y="50">steer</text>
  <path class="e" d="M466 80H418"/>
  <path class="e" d="M638 60H684"/>
  <path class="e" d="M684 80H640"/>

  <rect class="k" x="246" y="200" width="170" height="78" rx="8"/>
  <text class="h" x="331" y="232">Compare</text>
  <text class="s" x="331" y="252">with the original:</text>
  <text class="s" x="331" y="268">delta-zero, Witness</text>

  <rect class="b" x="468" y="200" width="170" height="78" rx="8"/>
  <text class="h" x="553" y="232">Compile</text>
  <text class="s" x="553" y="252">useful exchange</text>
  <text class="s" x="553" y="268">into a notebook</text>

  <rect class="b" x="686" y="200" width="170" height="78" rx="8"/>
  <text class="h" x="771" y="232">Replay</text>
  <text class="s" x="771" y="252">exact prompts</text>
  <text class="s" x="771" y="268">and context</text>

  <path class="e" d="M300 104V198"/>
  <text class="l" x="214" y="156">work returns</text>
  <path class="e" d="M362 200V106"/>
  <text class="l" x="370" y="156">drifted: steer again</text>
  <path class="e" d="M416 239H466"/>
  <path class="e" d="M638 239H684"/>
  <path class="e" d="M771 278V306H331V280"/>
  <text class="l" x="506" y="323">compare the replay with the original</text>
</svg>

# Source of Duo.xcodeproj. Regenerate with `xcodegen generate` in this directory
# (XcodeGen 2.46.0) and commit the result: Xcode Cloud needs the checked-in project.
# On Linux, set USER, and run the binary by its real path (through a symlink it segfaults).
name: Duo
options:
  bundleIdPrefix: dev.tidelands
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DuoCore:
    path: DuoCore
targets:
  Duo:
    type: application
    platform: iOS
    sources:
      - Duo
    dependencies:
      - package: DuoCore
    info:
      path: Duo/Info.plist
      properties:
        CFBundleDisplayName: Duo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tidelands.duo
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Duo:
    build:
      targets:
        Duo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: DuoCore/DuoCoreTests
    archive:
      config: Release

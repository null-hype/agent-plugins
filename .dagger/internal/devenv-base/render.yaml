services:
  - type: cron
    name: devpod-keepalive
    runtime: image
    image:
      url: ghcr.io/null-hype/devenv-keepalive:sha-350e89ba11b5a8f3ccec4d28522d03eacba62817
      creds:
        fromRegistryCreds:
          name: ghcr-null-hype
    schedule: "15 * * * *"
    envVars:
      - key: PROTON_PASS_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: WORKSPACE_ID
        value: devenv-base-gce

services:
  - type: cron
    name: devpod-keepalive
    runtime: image
    image:
      url: ghcr.io/null-hype/devenv-keepalive@sha256:bd9c574325971488a0cfc10d04378af720eb52022417bf161fe6f6c61a995f81
      creds:
        fromRegistryCreds:
          name: Citizen6.Librarian6.Refrain4
    schedule: "15 * * * *"
    envVars:
      - key: PROTON_PASS_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: WORKSPACE_ID
        value: devenv-base-gce

  # The dispatch supervisor (CIT-443, CIT-453): one hourly service that
  # continues one Claude session and works every open `Dispatch: <name>`
  # issue.
  #
  # Still commented out because one value cannot be written here yet: the
  # published image digest. PublishSupervisor tags sha-<commit>; pin the
  # digest the way devpod-keepalive above does, once the first publish has
  # run, then uncomment. See supervisor/README.md.
  #
  # One service, so Render's single-run guarantee holds for the one
  # transcript: a tick still running when the next is due delays that next
  # one. SUPERVISOR_TIMEOUT (default 50m) keeps a tick below the hour.
  #
  # - type: cron
  #   name: supervisor
  #   runtime: image
  #   image:
  #     url: ghcr.io/null-hype/devenv-supervisor@sha256:<pin after the first publish>
  #     creds:
  #       fromRegistryCreds:
  #         name: Citizen6.Librarian6.Refrain4
  #   schedule: "14 * * * *"
  #   envVars:
  #     - key: PROTON_PASS_PERSONAL_ACCESS_TOKEN
  #       sync: false
  #     - key: TOOLBOX_TOKEN
  #       sync: false

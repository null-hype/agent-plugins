services:
  - type: cron
    name: devpod-keepalive
    runtime: image
    image:
      url: ghcr.io/null-hype/devenv-keepalive@sha256:bd9c574325971488a0cfc10d04378af720eb52022417bf161fe6f6c61a995f81
      creds:
        fromRegistryCreds:
          name: Citizen6.Librarian6.Refrain4
    schedule: "15 * * * *"
    envVars:
      - key: PROTON_PASS_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: WORKSPACE_ID
        value: devenv-base-gce

  # One dispatch-window supervisor per zone (CIT-443). Three services, one
  # image, differing only in schedule and the two SUPERVISOR_ vars.
  #
  # Still commented out because one value cannot be written here yet: the
  # published image digest. PublishSupervisor tags sha-<commit>; pin the
  # digest the way devpod-keepalive above does, once the first publish has
  # run, then uncomment. See supervisor/README.md.
  #
  # Schedules are 15 minutes before each team's local midnight, because the
  # window has to open before Linear creates the dispatch issue at 00:01 --
  # a delegation that arrives mid-boot is lost. Render cron is UTC only, so
  # the two DST-observing zones list both candidate hours and the run itself
  # decides from the team's clock whether midnight is actually near; the
  # other run of the pair reports "nothing" and exits. Hong Kong keeps one
  # hour because it has no DST.
  #
  # Midnights land at 16:00, 23:00 and 05:00 UTC, so the longest stretch
  # with no supervisor awake is the 11 hours from New York's window to Hong
  # Kong's. That gap is the window a wedged host could sit in, and the
  # reason the VM keeps its own deadline.

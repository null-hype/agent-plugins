  #   name: supervisor-infrastructure
  #   runtime: image
  #   image:
  #     url: ghcr.io/null-hype/devenv-supervisor@sha256:<pin after the first publish>
  #     creds:
  #       fromRegistryCreds:
  #         name: Citizen6.Librarian6.Refrain4
